services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  library:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_POSTGRES: "True"
    depends_on:
      - db

  redis:
    image: redis:7-alpine

  celery:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
            celery -A library_service worker -l info"
    depends_on:
      - library
      - redis
      - db
    restart: on-failure
    env_file:
      - .env
    environment:
      USE_POSTGRES: "True"

  celery-beat:
    build: .
    command: >
      sh -c "python manage.py wait_for_db && 
            celery -A library_service beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - library
      - redis
      - db
    restart: on-failure
    env_file:
      - .env
    environment:
      USE_POSTGRES: "True"

volumes:
  postgres_data:
